services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vue-new-project-backend
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue-new-project
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  sqlite_data:
